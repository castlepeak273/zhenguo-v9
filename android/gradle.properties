# 本机内存有限(7.8G 且原无 swap)，把守护进程堆调小，避免被 OOM 杀掉。
# 原值 -Xmx3G + Kotlin 3G 会吃掉 6G，实测直接 OOM：
#   Out of memory: Killed process (java) anon-rss:4508164kB
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
